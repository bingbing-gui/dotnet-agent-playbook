<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="基于 ASP.NET Core 与 MCP 的智能天气顾问。">
  <title>云象 · AI 天气顾问</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260830-5">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css?v=20260830-5">
  <script src="app.js" type="module"></script>
</head>
<body class="bg-body-tertiary">
  <a class="skip-link" href="#main-content">跳至主要内容</a>

  <main id="main-content" class="container-fluid px-0 app-container">
    <section class="row g-0 app-layout min-vh-100">
      <aside class="col-12 col-lg-4 d-flex align-items-start justify-content-center p-3 p-md-4 status-pane">
        <article class="card shadow border-0 pane-card h-100">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">云象天气服务状态</h1>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 service-head">
              <div class="service-state" title="MCP 服务连接状态">
                <span class="pulse" aria-hidden="true"></span>
                <span id="service-state-text">正在检测服务</span>
              </div>
              <span class="badge rounded-pill text-bg-primary-subtle text-primary-emphasis service-tag">ASP.NET Core · MCP</span>
            </div>

            <dl class="system-list mt-4 mb-0">
              <div>
                <dt>MCP Server</dt>
                <dd><code id="server-endpoint">正在读取…</code></dd>
              </div>
              <div>
                <dt>天气数据</dt>
                <dd>Open-Meteo</dd>
              </div>
              <div>
                <dt>AI 模型</dt>
                <dd><code id="model-name">正在读取…</code></dd>
              </div>
            </dl>
          </div>
        </article>
      </aside>

      <section class="col-12 col-lg-8 d-flex align-items-start justify-content-center p-3 p-md-4 qa-pane">
        <article class="card shadow border-0 pane-card qa-card h-100">
          <div class="card-body p-4 p-md-5">
            <div class="prompt-chips d-flex align-items-center flex-wrap gap-2 mb-3" aria-label="提问示例">
              <small class="text-secondary">未来三天预报：</small>
              <button type="button" class="btn btn-sm btn-outline-secondary quick-prompt" data-prompt="请给我上海未来三天的天气预报，并给出出行建议。">上海未来三天</button>
              <button type="button" class="btn btn-sm btn-outline-secondary quick-prompt" data-prompt="请给我北京未来三天的天气预报，并给出穿衣建议。">北京未来三天</button>
              <button type="button" class="btn btn-sm btn-outline-secondary quick-prompt" data-prompt="请给我广州未来三天的天气预报，并提示降雨风险。">广州未来三天</button>
            </div>

            <form id="chat-form" class="agent-form">
              <label class="visually-hidden" for="message">向天气顾问提问</label>
              <textarea id="message" class="form-control" rows="6" required placeholder="请输入城市和需求，例如：请给我深圳未来三天的天气预报。"></textarea>
              <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mt-3">
                <small id="agent-hint" class="d-none" aria-hidden="true"></small>
                <button id="send-message" type="submit" class="btn btn-primary px-4">发送问题</button>
              </div>
            </form>

            <div id="agent-response" class="agent-response mt-3 pt-3 border-top" hidden>
              <div class="d-flex justify-content-between gap-2 response-heading">
                <strong>云象天气顾问</strong>
                <span id="agent-status" role="status" aria-live="polite" class="text-secondary small"></span>
              </div>
              <pre id="agent-output" class="mb-0 mt-2" tabindex="0"></pre>
            </div>
          </div>
        </article>
      </section>
    </section>

    <section class="legacy-weather" hidden aria-hidden="true">
      <form id="weather-form">
        <input id="city">
        <button id="query-weather" type="submit">查询</button>
        <button class="city-chip" type="button">北京</button>
      </form>
      <article class="result-card">
        <span id="weather-status"></span>
        <div id="weather-output" tabindex="0"></div>
      </article>
    </section>
  </main>
</body>
</html>
