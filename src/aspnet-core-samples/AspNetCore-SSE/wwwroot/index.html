<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASP.NET Core SSE Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { background: #f5f6f8; }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-connected { background: #198754; }
        .status-disconnected { background: #dc3545; }
        .status-connecting { background: #ffc107; }
        .connection-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        .event-log { max-height: 560px; overflow-y: auto; }
        code { color: #d63384; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="mb-4">
        <h1 class="h3 mb-2">ASP.NET Core SSE Demo</h1>
        <p class="text-secondary mb-0">
            .NET 10 + <code>TypedResults.ServerSentEvents()</code> + <code>SseItem&lt;T&gt;</code> + JavaScript EventSource
        </p>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-8">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                    <div>
                        <div class="text-secondary small mb-1">连接状态</div>
                        <div class="fw-semibold">
                            <span id="statusDot" class="status-dot status-disconnected"></span>
                            <span id="statusText">未连接</span>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button id="connectButton" class="btn btn-success" type="button">连接 SSE</button>
                        <button id="disconnectButton" class="btn btn-danger" type="button" disabled>断开连接</button>
                        <button id="clearButton" class="btn btn-outline-secondary" type="button">清空消息</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-secondary small mb-1">已接收消息</div>
                    <div id="messageCount" class="display-6 fw-semibold">0</div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info shadow-sm" role="alert">
        <strong>自动重连演示：</strong>
        服务端每个连接发送 10 条消息后主动结束连接，并通过 SSE 的 <code>retry</code> 指示浏览器 2 秒后重连。
        浏览器重连时会自动发送 <code>Last-Event-ID</code>，服务端根据它继续编号。
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span class="fw-semibold">实时 SSE 消息</span>
            <span id="lastEventBadge" class="badge text-bg-secondary">Last Event ID: -</span>
        </div>
        <div class="table-responsive event-log">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-light sticky-top">
                <tr>
                    <th style="width: 110px;">Event ID</th>
                    <th style="width: 140px;">Event Type</th>
                    <th style="width: 130px;">Connection</th>
                    <th style="width: 150px;">Server Time</th>
                    <th>Message</th>
                </tr>
                </thead>
                <tbody id="messageBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    let eventSource = null;
    let messageCount = 0;

    const connectButton = document.getElementById('connectButton');
    const disconnectButton = document.getElementById('disconnectButton');
    const clearButton = document.getElementById('clearButton');
    const messageBody = document.getElementById('messageBody');
    const messageCountElement = document.getElementById('messageCount');
    const lastEventBadge = document.getElementById('lastEventBadge');

    connectButton.addEventListener('click', connectSse);
    disconnectButton.addEventListener('click', disconnectSse);
    clearButton.addEventListener('click', clearMessages);

    function connectSse() {
        if (eventSource) {
            return;
        }

        updateStatus('connecting', '正在连接...');
        setButtons(true);

        eventSource = new EventSource('/api/sse');

        eventSource.onopen = () => {
            updateStatus('connected', '已连接');
            console.log('SSE connected.');
        };

        eventSource.addEventListener('server-message', event => {
            const data = JSON.parse(event.data);
            addMessage(event.lastEventId, event.type, data);
        });

        eventSource.onerror = () => {
            if (!eventSource) {
                return;
            }

            // 不调用 close()：浏览器原生 EventSource 会自动尝试重连。
            updateStatus('connecting', '连接断开，等待自动重连...');
            console.log('SSE connection lost. EventSource will retry automatically.');
        };
    }

    function disconnectSse() {
        if (!eventSource) {
            return;
        }

        eventSource.close();
        eventSource = null;

        updateStatus('disconnected', '已手动断开');
        setButtons(false);
    }

    function addMessage(eventId, eventType, data) {
        messageCount++;
        messageCountElement.textContent = messageCount;
        lastEventBadge.textContent = `Last Event ID: ${eventId || '-'}`;

        const serverTime = new Date(data.serverTime).toLocaleTimeString();
        const row = document.createElement('tr');

        row.innerHTML = `
            <td><span class="badge text-bg-secondary">${escapeHtml(eventId)}</span></td>
            <td><code>${escapeHtml(eventType)}</code></td>
            <td><span class="connection-id">${escapeHtml(data.connectionId)}</span></td>
            <td>${escapeHtml(serverTime)}</td>
            <td>${escapeHtml(data.message)}</td>
        `;

        messageBody.prepend(row);
    }

    function clearMessages() {
        messageBody.innerHTML = '';
        messageCount = 0;
        messageCountElement.textContent = '0';
        lastEventBadge.textContent = 'Last Event ID: -';
    }

    function updateStatus(status, text) {
        const dot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        dot.className = `status-dot status-${status}`;
        statusText.textContent = text;
    }

    function setButtons(isConnected) {
        connectButton.disabled = isConnected;
        disconnectButton.disabled = !isConnected;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
