<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quartz 定时任务监控中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/site.css?v=20260830-6" />
</head>
<body>
    <main class="app-shell">
        <header class="top-nav navbar navbar-expand bg-body border-bottom shadow-sm">
            <div class="nav-left">
                <div class="brand-dot"></div>
                <span class="brand-title">定时任务监控中心</span>
            </div>
            <div class="nav-right">
                <p class="hint mb-0">固定任务：<code>demo-timer</code>（10 秒间隔，SignalR 推送）</p>
            </div>
        </header>

        <section class="content-wrap">
            <section class="overview-grid">
                <article class="panel">
                    <h2 class="panel-title">运行状态</h2>
                    <div class="status-hero">
                        <div class="status-icon" id="status-circle">
                            <i id="status-circle-icon" class="bi bi-check-circle-fill" aria-hidden="true"></i>
                        </div>
                        <div class="status-main">
                            <p class="status-title" id="health-state">待机</p>
                            <p class="status-subtitle" id="health-desc">等待任务开始执行</p>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="startBtn" class="btn btn-primary" type="button">启动</button>
                        <button id="stopBtn" class="btn btn-outline-secondary" type="button">停止</button>
                        <button id="refreshBtn" class="btn btn-outline-primary" type="button">刷新状态</button>
                    </div>
                    <p id="message" class="message"></p>

                    <dl class="mini-grid status-mini-grid">
                        <dt>运行中</dt><dd id="status-running">-</dd>
                        <dt>执行中</dt><dd id="status-executing">-</dd>
                        <dt>间隔(秒)</dt><dd id="status-interval">-</dd>
                    </dl>
                </article>

                <section class="panel records-panel">
                    <h2 class="panel-title">最新执行记录</h2>
                    <div class="table-wrap table-responsive">
                        <table class="data-table table table-sm table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>事件</th>
                                    <th>开始时间</th>
                                    <th>结束时间</th>
                                    <th>错误</th>
                                </tr>
                            </thead>
                            <tbody id="allTimersBody">
                                <tr><td colspan="4" class="empty">暂无推送记录</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="/js/app.js?v=20260830-6"></script>
</body>
</html>
